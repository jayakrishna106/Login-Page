apiVersion: v1
kind: Pod
metadata: 
  name: task-pv-pod
spec:
  volumes:
    -  name: task-pv-storgae
       persistentVolumeClaim: 
          claimName: task-pv-claim

  containers:
    - name: pv-container
      image: nginx
      ports: 
        - containerPort: 80
          name: "hhtp-server"
      volumeMounts:
        - mountPath: "/usr/share/nginx/html"
          name: task-pv-storage