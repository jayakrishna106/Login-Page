#dev deployment file
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: login
  namespace: dev
  labels:
    app: login
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
    spec:
      containers:
      - name: login
        image: neelimajaya/login
        ports:
        - containerPort: 80